# network_mode host/service, rentang port, healthcheck NONE, variabel tak ter-resolve.
services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  vpn:
    image: qmcgaw/gluetun
    cap_add: [NET_ADMIN]
    ports:
      - "8888:8888/tcp"
      - "${VPN_PORT}:1194/udp"
      - "6881-6889:6881-6889"
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      WIREGUARD_PRIVATE_KEY: ${WG_KEY:?wajib diisi}

  torrent:
    image: linuxserver/qbittorrent:latest
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]

  grafana:
    image: grafana/grafana-oss:11.2.0
    ports:
      - 3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_PASSWORD
    volumes:
      - grafana:/var/lib/grafana
      - ${CONFIG_DIR:-./config}/grafana:/etc/grafana/provisioning

volumes:
  grafana:
