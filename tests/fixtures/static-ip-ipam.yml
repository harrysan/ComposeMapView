# Static IP dengan ipam, long syntax ports/volumes, external network, field version lama.
version: "3.9"

services:
  dns:
    image: coredns/coredns:1.11.1
    ports:
      - target: 53
        published: 53
        protocol: udp
        host_ip: 0.0.0.0
      - target: 53
        published: "53"
        protocol: tcp
    volumes:
      - type: bind
        source: ./Corefile
        target: /Corefile
        read_only: true
    networks:
      infra:
        ipv4_address: 172.30.0.53

  proxy:
    image: traefik:v3.1
    ports:
      - "80:80"
      - "[::1]:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      infra:
        ipv4_address: 172.30.0.10
      public:

  db:
    image: postgres@sha256:4ec37d2a07a0067f176fdcc9d4bb633a5724d2cc4f892c7a2046d054bb6939e5
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg
      - PGDATA
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
      - type: tmpfs
        target: /tmp
    healthcheck:
      test: pg_isready -U postgres
    networks:
      infra:
        ipv4_address: 172.30.1.5

networks:
  infra:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
  public:
    external: true

volumes:
  pgdata:
    driver: local
